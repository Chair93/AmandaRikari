name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure app exists
        run: flyctl apps list | grep -q "^amanda-rikari " || flyctl apps create amanda-rikari
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Ensure volume exists
        run: |
          flyctl volumes list -a amanda-rikari | grep -q rikari_data || \
          flyctl volumes create rikari_data --region gru --size 1 -a amanda-rikari --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set app secrets
        run: flyctl secrets set JWT_SECRET="${{ secrets.APP_JWT_SECRET }}" -a amanda-rikari
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --remote-only -a amanda-rikari
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
