# fly.toml app configuration file generated for amandarikari on 2026-07-27T12:29:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'amandarikari'
primary_region = 'ams'

[build]

[env]
  DATABASE_URL = 'file:/data/dev.db'
  PORT = '4000'

[[mounts]]
  source = 'rikari_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
